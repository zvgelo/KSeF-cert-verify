name: Build

# Buduje i TESTUJE instalację wszystkich pakietów (Windows: Inno Setup; Linux: AppImage, RPM, DEB) na właściwych
# platformach. Niczego nie publikuje. Używane też przez release.yml (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "SHA commita do zbudowania (z bramki release.yml)"
        type: string
        required: false
  workflow_dispatch:

permissions: {}

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Inno Setup 6 (jeśli brak na obrazie runnera)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Brak ISCC.exe" }
          Write-Host "ISCC: $iscc"
      - name: Build, testy EXE i test instalatora (packaging/windows/build.ps1)
        shell: pwsh
        # testy pytest uruchamia osobno ci.yml; tu: kroki 1-3 i 5-9 + cicha instalacja/odinstalowanie
        run: ./packaging/windows/build.ps1 -UseCurrentPython -SkipTests -TestInstaller
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/*-win-x64-portable.exe
            dist/*-win-x64-cli.exe
          if-no-files-found: error

  linux-payload:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Biblioteki systemowe (analiza PyInstaller)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libglib2.0-0 libgssapi-krb5-2
      - run: pip install -e ".[dev]"
      - run: packaging/linux/build.sh payload
      - run: tar -C dist -czf payload.tar.gz ksef-cert-verify GLIBC_MIN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-payload
          path: payload.tar.gz
          if-no-files-found: error

  fixtures:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Syntetyczna para testowa (nie jest certyfikatem KSeF)
        run: |
          pip install cryptography
          python scripts/make_fixture_pair.py fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures

  deb:
    needs: linux-payload
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-payload
      - run: mkdir -p dist && tar -C dist -xzf payload.tar.gz
      - run: packaging/linux/build.sh deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  deb-test:
    needs: [deb, fixtures]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: pkg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures
      - name: E2E w kontenerze ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/fixtures:/fix:ro" \
            -v "$PWD/packaging/linux/test-install.sh:/t.sh:ro" "$IMAGE" \
            bash -c 'bash /t.sh deb "$(ls /pkg/*.deb | head -1)" /fix'

  rpm:
    needs: linux-payload
    runs-on: ubuntu-22.04
    container: fedora:44
    permissions:
      contents: read
    steps:
      - run: dnf -y install rpm-build tar gzip python3 git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-payload
      - run: mkdir -p dist && tar -C dist -xzf payload.tar.gz
      - run: packaging/linux/build.sh rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  rpm-test:
    needs: [rpm, fixtures]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm
          path: pkg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures
      - name: E2E w kontenerze fedora:44
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/fixtures:/fix:ro" \
            -v "$PWD/packaging/linux/test-install.sh:/t.sh:ro" fedora:44 \
            bash -c 'bash /t.sh rpm "$(ls /pkg/*.rpm | head -1)" /fix'

  appimage:
    needs: linux-payload
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      # appimagetool 1.9.1 – suma SHA-256 z metadanych oficjalnego wydania GitHub (AppImage/appimagetool)
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  # pragma: allowlist secret (publiczna suma SHA-256 wydania appimagetool)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-payload
      - run: mkdir -p dist && tar -C dist -xzf payload.tar.gz
      - name: appimagetool (przypięta wersja, weryfikacja SHA-256)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
      - run: APPIMAGETOOL="$PWD/appimagetool" packaging/linux/build.sh appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  appimage-test:
    needs: [appimage, fixtures]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ubuntu:22.04"
            pre: "apt-get update -qq && apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libglib2.0-0 libgssapi-krb5-2 >/dev/null"
          - image: "debian:12"
            pre: "apt-get update -qq && apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libglib2.0-0 libgssapi-krb5-2 >/dev/null"
          - image: "fedora:44"
            pre: "dnf -y -q install mesa-libEGL mesa-libGL libxkbcommon libxkbcommon-x11 xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm libxcb fontconfig dbus-libs glib2 krb5-libs >/dev/null"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: pkg
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures
      - name: E2E AppImage w kontenerze ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          PRE: ${{ matrix.pre }}
        run: |
          docker run --rm -e PRE -v "$PWD/pkg:/pkg:ro" -v "$PWD/fixtures:/fix:ro" \
            -v "$PWD/packaging/linux/test-install.sh:/t.sh:ro" "$IMAGE" \
            bash -c 'eval "$PRE" && cp /pkg/*.AppImage /tmp/app.AppImage && bash /t.sh appimage /tmp/app.AppImage /fix'

  checksums:
    needs: [windows, deb-test, rpm-test, appimage-test, rpm, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: SHA256SUMS
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.AppImage' -o -name '*.rpm' -o -name '*.deb' -o -name '*-setup.exe' -o -name '*-win-x64-portable.exe' -o -name '*-win-x64-cli.exe' \) -exec cp {} dist/ \;
          cd dist && sha256sum $(ls | sort) > ../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
